<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Agentic AI EDR{% endblock %}
    </title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bulma.min.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css')}}">
</head>

<body>

    <!-- Contains the sidebar and main content -->
    <div class="app-layout">

        <!-- Left navigation sidebar -->
        <aside class="sidebar menu">

            <!-- Application name -->
            <h1 class="title is-5">
                Agentic AI EDR
            </h1>

            <!-- Navigation heading -->
            <p class="menu-label">Welcome User</p>

            <!-- Navigation links -->
            <ul class="menu-list">
                <li><a href="/">Dashboard</a></li>
                <li><a href="/alerts">Security Alerts</a></li>
                <li><a href="/events">Events Timeline</a></li>
                <li><a href="/aiInvestigation">AI Investigations</a></li>
                <li><a href="/mitre">MITRE ATT&CK</a></li>
                <li><a href="/performance">Performance</a></li>
                <li><a href="/settings">Settings</a></li>
            </ul>

        </aside>

        <!-- Main page content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

    </div>

    <script
    src="{{ url_for('static', filename='js/utils.js') }}"
    defer>
    </script>

</body>
</html>
